name: Deploy site (no API access)

# Publishes the site whenever main changes. This workflow has NO access to the secrets and never calls
# the Bioto API: it reuses the data that is already online (or the committed snapshot in static-data/).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/pages-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build (no API request)
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node scripts/build-pages.js

      - name: Verify (URLs, imports, no secrets in the site)
        run: node scripts/verify-dist.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
